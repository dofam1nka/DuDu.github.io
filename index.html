<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuDu Games — Каталог онлайн игр</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0b0f19; color: #fff; margin: 0; padding: 0; }
        header { background: #161c2d; padding: 20px; text-align: center; border-bottom: 2px solid #3b82f6; }
        header h1 { margin: 0; color: #3b82f6; font-size: 2rem; }
        header p { margin: 5px 0 0 0; color: #94a3b8; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .section-title { font-size: 1.5rem; margin-bottom: 20px; color: #f8fafc; border-left: 4px solid #3b82f6; padding-left: 10px; }
        .grid { display: flex; flex-wrap: wrap; gap: 20px; }
        .card { background: #1e293b; border-radius: 12px; width: 220px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px rgba(59,130,246,0.2); }
        .card-preview { height: 130px; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
        .card-info { padding: 15px; }
        .card-info h3 { margin: 0 0 8px 0; font-size: 1.1rem; }
        .card-info p { margin: 0 0 15px 0; color: #94a3b8; font-size: 0.85rem; height: 35px; overflow: hidden; }
        .play-btn { display: block; text-align: center; background: #3b82f6; color: #fff; text-decoration: none; padding: 8px 0; border-radius: 6px; font-weight: bold; font-size: 0.9rem; transition: 0.2s; }
        .play-btn:hover { background: #2563eb; }
    </style>
</head>
<body>

    <header>
        <h1>🎮 DuDu Games</h1>
        <p>Твой личный портал браузерных ИИ-игр для ПК и телефонов</p>
    </header>

    <div class="container">
        <div class="section-title">Все игры</div>
        <div class="grid">
            
            <!-- Карточка первой игры -->
            <div class="card">
                <div class="card-preview">🚀</div>
                <div class="card-info">
                    <h3>Игра №1</h3>
                    <p>Наша первая игра от нейросети. Скоро запуск!</p>
                    <a href="snake.html" class="play-btn">Играть</a>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
